# org/config.yaml — the one organization this system runs.
# One org, one Director, one team, two lanes. Grow later; start here.

org:
  name: "Acme"                 # your organization's name
  team: "core"                 # the one team

# Which task backend is plugged in. Swap this ONE value to change everything.
#   linear  -> Linear (default; native OKR hierarchy). Needs LINEAR_API_KEY exported.
#   github  -> GitHub Issues (needs `gh auth login`)
#   files   -> local markdown board (zero deps, offline, great for a first run)
backend: linear

# Only used when backend: linear — the Linear team key (Initiative/Project/Issue live here).
# Export LINEAR_API_KEY too (e.g. `source ~/.gsai/secrets/linear.env`).
linear_team: "CFW"
# Multi-team mode: ONE Dozer that polls SEVERAL teams (comma-separated keys).
# If set, it overrides linear_team — the simplest way to run every org at once.
linear_teams: "CFW,LL,BRD,GSAI,DLY"           # serve both orgs from one Dozer
# Parallel crews one Dozer runs at once (fan-out). 1 = sequential; up to ~8.
fanout: 5                                     # 5 parallel crews (Vas, 2026-09-04). History: 8 saturated shared Claude Code usage (throttled to 3 on 2026-09-03); per-role model routing (models:) now lets roles move off Claude to relieve that.

# Only used when backend: github
repo: "OWNER/REPO"             # e.g. acme/dozers

# The lanes the Dozer can execute. Each needs a script at dozers/lanes/<lane>.sh
lanes:
  - dev                        # code work
  - marketing                  # content work (staged for human approval)

# Optional brand voice for the marketing lane.
# (skeleton: dozers/lanes/marketing.sh has the TODO to read this, not yet wired.)
brand:
  voice: "clear, warm, no hype"

# ── Marketing-lane stage backstop (GSAI-33) ─────────────────────────────────
# The crew's content model runs ISOLATED from the operator's harness (claude --safe-mode:
# no output styles, hooks, CLAUDE.md, MCP) so nothing personal can land in a publishable
# draft. This regex (grep -E, one line) is the belt behind that buckle: any draft line
# matching it is stripped on stage, moved into the reviewer handoff note, and logged as
# a leak. Default = the "👨 Daddy says" footer that hit 24/24 drafts on 2026-09-06.
# Leave unset for the default; it is a backstop, not the fix — if it ever fires, the
# isolation broke and that is the bug to chase.
# output_style_footer: "^[[:space:]]*(👨[[:space:]]*)?Daddy says"

# ── Where the Dozer works ────────────────────────────────────────────────────
# CANONICAL: paths are resolved from ~/ecosystem/ecosystem.yaml via
# tasks/ecosystem_workdir.py — NEVER hardcoded here or in a label. Order:
#   1) the task's repo:<id> hint  -> ecosystem.yaml project.id == id   (multi-repo orgs)
#   2) the task's Linear team key -> the org whose linear_team == KEY, its default repo
#      → a LearnLoop (LL) task lands in the learnloop repo automatically, no label
#   3) workdir_default            (last resort, and ONLY when the task named no repo)
#
# Routing FAILS LOUD (GSAI-131). A task that carries an identity — a repo: label or a
# team — is routed by the registry or it is not routed at all: an unresolvable
# repo:<id> BLOCKS with the resolver's real error, is never demoted into the team's
# default repo, and never lands in ~/Code/dozers. Step 3 below therefore applies to
# exactly one kind of task: one that names NEITHER a repo nor a team. For those, "."
# means "the repo the Dozer ships in" — the zero-config/files-backend mode where the
# Dozer works on itself. Set an absolute path here for a different catch-all.
#
# The old hardcoded `workdirs:` map was REMOVED 2026-08-31 — ecosystem.yaml is the
# single source of truth. Register new repos there (id, org, local), not here.
workdir_default: "."

# ── Dev lane pipeline knobs (per-repo build/merge behavior) ──────────────────
integration_branch: "develop"   # branch the Dozer cuts dozer/<id> off and merges back into — when a repo has none, the crew falls back to its default branch (main) rather than creating it (GSAI-15)
branch_prefix: "dozer"           # task branch = <branch_prefix>/<task-id>, e.g. dozer/CFW-9
worktree_root: "~/.dozers/worktrees"   # where task + merge worktrees live
model_cmd: "claude -p"           # LEGACY flat default — superseded by `models:` below (still honoured via MODEL_CMD)
push: "false"                    # push the integration branch to origin after merge

# ── Test gate (GSAI-27) — deliberately NOT configurable here ────────────────
# The dev lane refuses to merge a repo where no test command can be detected: an
# unverified merge is not a green one. There is no knob in this file on purpose —
# a switch that turns the gate off for every repo at once is not a gate. Opt a
# SINGLE repo out with a `.dozers-no-test-gate` file in it, or `no_test_gate: true`
# on its ~/ecosystem/ecosystem.yaml project entry; TEST_GATE=off waives one run.
# The gate is checked as a PREFLIGHT before the coding agent too (GSAI-32), so an
# ungatable repo costs no model time. TEST_GATE=bootstrap skips only that preflight —
# for the one task whose job IS to add the test command; the merge is still gated.

# ── Time bounds on crew commands (GSAI-37) ──────────────────────────────────
# Every command a crew hands to a repo or a model runs under dozers/timebox.sh and is
# killed (whole process group) when it exceeds its bound; the task then FAILS with the
# timeout named in the block comment. A hang costs one issue, never a slot or the
# engine. Whole seconds; 0 = deliberately unbounded (visible in the log, never a
# default). Per-run override: DOZER_TIMEOUT_<NAME> (e.g. DOZER_TIMEOUT_TEST=1800).
timeout_model: 3600     # the coding / content agent run (a resumable crew re-picks committed work)
timeout_test: 900       # one test run — task worktree and green-gate alike
timeout_deps: 900       # a lockfile install (npm ci / pnpm / yarn)
timeout_push: 300       # git push of the integration branch (only when push: "true")
timeout_compose: 1800   # the video lane's COMPOSE_CMD pipeline (its model compose uses timeout_model)

# ── Migration gate (LL-31 guardrail) ────────────────────────────────────────
# Before merging, if the branch touches a DB schema file but ships no matching
# migration, the merge is BLOCKED and sent back — a schema drift with no
# migration breaks deploys. Globs below default to Prisma; repos with no schema
# files are a no-op. Disable with MIGRATION_GATE=off; a legit schema-only edit
# that needs no migration can carry [skip-migration] in a commit message.
schema_globs: "*.prisma"                        # space-separated; what counts as a schema change
migration_globs: "*/migrations/* */migrate/*"   # space-separated; what counts as a migration

# ── Liveness alarm (dozers/heartbeat-check.sh, GSAI-31) ─────────────────────
# Where the watchdog shouts when the engine stops beating (or beats but stops
# dispatching). PRIMARY: Linear — the alarm IS the `board:to_review` label on the
# standing tracking issue below; the Board view filters on exactly that label, so it is
# the only write that reaches a human. OPTIONAL second hop: Buzz — sent when
# BUZZ_PRIVATE_KEY is present, skipped quietly when it is not; a missing optional
# channel never suppresses the primary one. Ids/channels/pubkeys are addresses, not
# secrets — the keys are read from the vault files below (vault-first).
alarm_issue: "GSAI-38"                                  # standing tracking issue the alarm flags (GSAI: Housekeeping)
alarm_linear_env: "~/ecosystem/vault/linear.env"        # vault file holding LINEAR_API_KEY
alarm_channel: "79c94c7b-4969-4320-a379-c4edc67df34b"   # Buzz channel: cfw.social (optional hop)
alarm_mention: "557d141c51da17bab381925acbd26fc4bb2805cfd4d461c337b355d27f2477f6"  # @Fizz (chief)
alarm_env: "~/ecosystem/vault/buzz.env"                 # vault file holding BUZZ_PRIVATE_KEY + BUZZ_RELAY_URL
# NOTE (2026-09-08): the Buzz hop is LIVE and delivers signed as Guzz — the Dev-Director
# identity, which is the Dozer's own voice. History: the key was deliberately cleared on
# 2026-09-03 when the identity moved into Buzz Desktop as a managed agent, then recovered
# on 2026-09-08 out of the macOS login keychain (service "buzz-desktop", account
# "secrets", stored as agent:<pubkey> -> nsec) back into buzz.env, so the CLI has a key
# again. This relay is CLOSED, so the key ALONE is not enough — Guzz is only a channel
# member and the relay 403s `relay_membership_required` on it. buzz.env therefore also
# carries BUZZ_AUTH_TAG, a NIP-OA attestation signed by the owner key that delegates the
# owner's relay membership to Guzz (events are still authored and signed BY Guzz; the tag
# only proves he authorized the agent). It reaches the `buzz` child because the whole
# vault file is sourced under `set -a` — re-mint the tag if the owner key rotates, or the
# hop starts 403ing. `heartbeat-check.sh creds` shows which channels can deliver today.
# Do NOT repoint alarm_env at buzz-owner.env — that is Vasanth's own key, and an alarm
# signed as him is a lie about who is speaking; Guzz has his own identity precisely so
# the watchdog can speak as itself.
alarm_interval: 300                                     # how often the launchd agent runs the check (s)

# ── Model routing — which brain each ROLE runs on. Swap a role's provider any time. ──
# provider: claude | ollama-cloud | ollama-local | codex     model: provider-specific id ("" = provider default)
# A role is a lane name (`dev`, `marketing`) or a DOTTED per-pass role: the dev lane
# runs three passes — dev.architect (plan -> DOZER-DESIGN.md), dev.build (implement),
# dev.review (verdict -> DOZER-REVIEW.md) — each with its own route below. A nested
# lane entry maps role -> {provider, model}; a FLAT entry (one carrying `provider`)
# is shared by every role of that lane. `default` covers anything unlisted.
# Env override wins:  DOZER_MODEL_<LANE>[_<ROLE>]="<provider>[:<model>]"  (dots fold to `_`)
#   e.g. DOZER_MODEL_DEV=ollama-cloud:glm-5.2  ·  DOZER_MODEL_DEV_BUILD=ollama-cloud:kimi-k3:cloud
# `small` (string on a nested lane) / `small_model:` (on a flat entry) pins
# ANTHROPIC_SMALL_FAST_MODEL for ollama routes — auto-compact and title-gen then run on
# the cheap model instead of the main one. Unset: small = main (the old behaviour).
# Note: Claude versions that don't know `:cloud` model ids emit a benign "unrecognized
# model" warning (auto-compact then assumes a 200k window) — the route still works.
# Inspect with `dozers/model.sh show`; test a provider with `dozers/model.sh smoke <provider> [model]`.
# PIN THE MODEL. An empty `model` on a claude route means no `--model` flag, which
# hands the choice to whatever the Claude Code CLI defaults to that day. That default
# drifted opus-4-8 -> fable-5-1 -> opus-5 inside one week and put 37% of all Dozer
# spend ($527) through Fable 5.1 at $10/$50 per MTok — 2x Opus 5 — chosen by nobody.
# model_route.py now REFUSES an empty claude model from config; this is the fix, not
# the workaround. (GSAI-83)
models:
  default: { provider: claude, model: "claude-opus-5" }
  dev:
    architect: { provider: ollama-cloud, model: "glm-5.3:cloud" }
    build:     { provider: ollama-cloud, model: "kimi-k3:cloud" }
    review:    { provider: ollama-cloud, model: "glm-5.3:cloud" }
    small:     "glm-5.3-flash:cloud"
  marketing: { provider: ollama-cloud, model: "glm-5.3:cloud", small_model: "glm-5.3-flash:cloud" }
ollama_env: "~/ecosystem/vault/ollama-cloud.env"   # where OLLAMA_API_KEY lives (vault-first); or export OLLAMA_API_KEY
