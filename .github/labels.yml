# .github/labels.yml — the state machine, as GitHub labels.
# Apply with:  gh label create <name> --color <hex> --description "…"
# (or the ./setup.sh helper). These four labels ARE the workflow.

- name: ready
  color: "16a05a"
  description: "Director approved — the Dozer may pick this up"

- name: "lane:dev"
  color: "d98419"
  description: "Code work — routed to dozers/lanes/dev.sh"

- name: "lane:marketing"
  color: "cf5a80"
  description: "Content work — routed to dozers/lanes/marketing.sh (human approval)"

- name: "status:wip"
  color: "5b57e0"
  description: "A Dozer has claimed this and is running it"

- name: "status:done"
  color: "6b7688"
  description: "Dozer finished"
