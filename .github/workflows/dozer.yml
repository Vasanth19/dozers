# .github/workflows/dozer.yml — run the Dozer in the cloud, no always-on machine.
#
# This is the shareable equivalent of your local scheduler: every 15 minutes
# (and on demand) it drains anything the Director has stamped ready+lane.
# Disable it and run dozers/dozer.sh locally instead if you prefer.
name: dozer

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes
  workflow_dispatch: {}         # run-now button in the Actions tab

permissions:
  issues: write                 # the Dozer moves labels / closes issues
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    env:
      BACKEND: github
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Drain ready work
        run: |
          chmod +x dozers/dozer.sh dozers/lanes/*.sh tasks/*.sh
          ./dozers/dozer.sh once
